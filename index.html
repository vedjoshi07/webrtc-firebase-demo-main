<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VideoLink</title>
<style>
  body { margin:0; background:#111; color:#fff; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; }
  .card { background:#1a1d24; padding:2rem; border-radius:12px; text-align:center; max-width:360px; width:90%; }
  h1 { margin:0 0 0.5rem; font-size:1.6rem; }
  p { color:#999; margin:0 0 1.5rem; font-size:0.9rem; }
  .icon { font-size:2rem; margin-bottom:0.5rem; }
  input { width:100%; padding:0.85rem; background:#111318; border:1px solid #333; border-radius:8px; color:#fff; font-size:1rem; box-sizing:border-box; margin-bottom:0.75rem; }
  input:focus { border-color:#25D366; outline:none; }
  button { width:100%; padding:0.85rem; background:#25D366; color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📹</div>
  <h1>VideoLink</h1>
  <p>Video calls, simple and free.</p>
  <input id="nameInput" placeholder="Your name" />
  <button id="joinBtn">Join</button>
</div>
<script>
  document.getElementById('joinBtn').onclick = () => {
    const name = document.getElementById('nameInput').value.trim();
    if (name) alert('Hello ' + name + '! App is working.');
    else alert('Enter your name');
  };
</script>
</body>
</html>
