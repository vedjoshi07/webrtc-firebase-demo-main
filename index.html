<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon-C49brna2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VideoLink – Video Calls</title>
    <meta name="description" content="Simple 1-to-1 video calls powered by WebRTC." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-9s6yDHWh.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BjAgREDA.css">
  </head>
  <body>

    <!-- ═══ Toast Container ═══ -->
    <div id="toastContainer" class="toast-container"></div>

    <div class="app">

      <!-- ═══ Login Screen ═══ -->
      <div id="loginScreen" class="screen active">
        <div class="login-bg"></div>
        <div class="login-content">
          <div class="login-logo">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="23 7 16 12 23 17 23 7" />
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
            </svg>
            <span>VideoLink</span>
          </div>
          <p class="login-subtitle">Connect face-to-face, instantly.</p>
          <div class="login-card glass">
            <h2>Welcome</h2>
            <p class="text-muted">Enter your name to join the network.</p>
            <div class="input-group">
              <input type="text" id="usernameInput" placeholder="Your name" class="input-field" maxlength="20" />
            </div>
            <button id="loginBtn" class="btn btn-primary full-width">Join Network</button>
          </div>
        </div>
      </div>

      <!-- ═══ Main Screen (Contacts / Recent / Dial) ═══ -->
      <div id="mainScreen" class="screen">
        <div class="main-header">
          <div class="main-header-left">
            <div class="header-logo">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="23 7 16 12 23 17 23 7" />
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
              </svg>
              <span>VideoLink</span>
            </div>
          </div>
          <div class="main-header-right">
            <span class="badge" id="myUsernameBadge">Me</span>
            <button id="logoutBtn" class="btn-icon" title="Logout">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
          <button class="tab active" data-tab="contacts">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Contacts
          </button>
          <button class="tab" data-tab="recent">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Recent
          </button>
          <button class="tab" data-tab="dial">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.45 2 2 0 0 1 3.59 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.96a16 16 0 0 0 6 6l.92-.92a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16.92z"/></svg>
            Dial
          </button>
        </div>

        <!-- Contacts Tab -->
        <div id="tabContacts" class="tab-content active">
          <div class="search-bar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Search contacts..." class="search-input" />
          </div>
          <div id="contactsList" class="contacts-list"></div>
        </div>

        <!-- Recent Tab -->
        <div id="tabRecent" class="tab-content">
          <div id="recentList" class="contacts-list"></div>
        </div>

        <!-- Dial Tab -->
        <div id="tabDial" class="tab-content">
          <div class="dial-pad">
            <div class="dial-header">
              <input type="text" id="dialInput" placeholder="Enter name..." class="input-field dial-input" maxlength="20" />
            </div>
            <div class="dial-actions">
              <button id="dialBtn" class="btn btn-success btn-call-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.45 2 2 0 0 1 3.59 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.96a16 16 0 0 0 6 6l.92-.92a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16.92z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- ═══ Call Screen ═══ -->
      <div id="callScreen" class="screen call-screen">
        <video id="remoteVideo" autoplay playsinline class="video-full"></video>
        <div class="video-placeholder" id="remotePlaceholder">
          <div class="spinner"></div>
          <span>Connecting...</span>
        </div>

        <div class="pip-container" id="pipContainer">
          <video id="webcamVideo" autoplay playsinline muted class="video-pip"></video>
          <div class="video-placeholder pip-placeholder" id="localPlaceholder">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          </div>
        </div>

        <div class="call-info">
          <h2 id="callPeerName">Unknown</h2>
          <span class="call-timer" id="callTimer">Ringing...</span>
        </div>

        <div class="call-controls">
          <button id="muteBtn" class="control-btn" title="Mute">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
          <button id="videoToggleBtn" class="control-btn" title="Video">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          </button>
          <button id="hangupBtn" class="control-btn btn-danger-solid" title="End Call">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 3.59 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.96"/></svg>
          </button>
        </div>
      </div>

      <!-- ═══ Incoming Call Overlay ═══ -->
      <div id="incomingCallOverlay" class="incoming-overlay hidden">
        <div class="incoming-card glass">
          <div class="incoming-pulse"></div>
          <div class="caller-avatar" id="incomingAvatar">?</div>
          <h3 id="incomingCallerName">Someone</h3>
          <p>Incoming Call</p>
          <div class="incoming-actions">
            <button id="declineBtn" class="incoming-btn decline-btn" title="Decline">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 3.59 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.96"/></svg>
            </button>
            <button id="acceptBtn" class="incoming-btn accept-btn" title="Accept">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.45 2 2 0 0 1 3.59 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.96a16 16 0 0 0 6 6l.92-.92a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16.92z"/></svg>
            </button>
          </div>
        </div>
      </div>

    </div>

  </body>
</html>
