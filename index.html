<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon-C49brna2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VideoLink</title>
    <meta name="description" content="Video calls, simple and free." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-DksiVmyQ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DfF7L-tQ.css">
  </head>
  <body>

    <div id="toastContainer" class="toast-container"></div>

    <!-- ═══ LOGIN ═══ -->
    <div id="loginScreen" class="screen">
      <div class="login-bg"></div>
      <div class="login-inner">
        <div class="login-card">
          <div class="login-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="23 7 16 12 23 17 23 7" />
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
            </svg>
          </div>
          <h1>VideoLink</h1>
          <p class="login-sub">Video calls, simple and free.</p>
          <input type="text" id="usernameInput" placeholder="Your name" class="input" maxlength="20" />
          <button id="loginBtn" class="btn-primary">Join</button>
        </div>
      </div>
    </div>

    <!-- ═══ APP ═══ -->
    <div id="appScreen" class="screen">

      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-header-left">
            <div class="avatar" id="myAvatar">V</div>
            <span class="sidebar-user-name" id="myUsernameBadge">You</span>
          </div>
          <button id="logoutBtn" class="icon-btn" title="Logout">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </button>
        </div>

        <div class="search-wrap">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input type="text" id="searchInput" placeholder="Search contacts..." class="search-input" />
        </div>

        <div class="sidebar-tabs">
          <button class="stab active" data-tab="contacts">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            Contacts
          </button>
          <button class="stab" data-tab="recent">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            Recent
          </button>
        </div>

        <div class="sidebar-list" id="contactsList"></div>
        <div class="sidebar-list hidden" id="recentList"></div>
      </div>

      <!-- Main Panel -->
      <div class="main-panel">
        <!-- Welcome -->
        <div id="welcomeView" class="panel-view">
          <div class="welcome-content">
            <div class="welcome-icon">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="23 7 16 12 23 17 23 7" />
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
              </svg>
            </div>
            <h2>Select a contact</h2>
            <p>Choose someone from the list or dial a name to start a video call.</p>
          </div>
        </div>

        <!-- Contact Detail -->
        <div id="contactView" class="panel-view hidden">
          <div class="contact-detail-header">
            <button id="backToList" class="icon-btn">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
              </svg>
            </button>
            <div class="avatar large" id="detailAvatar">?</div>
            <h2 id="detailName">Name</h2>
            <span class="detail-status" id="detailStatus">Online</span>
          </div>
          <div class="contact-detail-actions">
            <button id="detailCallBtn" class="call-action-btn">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.45 2 2 0 0 1 3.59 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.96a16 16 0 0 0 6 6l.92-.92a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16.92z"/>
              </svg>
              <span>Video Call</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Dial FAB -->
      <button id="dialFab" class="fab">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>

      <!-- Dial Sheet -->
      <div id="dialOverlay" class="sheet-overlay hidden">
        <div class="sheet">
          <div class="sheet-handle"></div>
          <h3>Dial a name</h3>
          <p class="sheet-sub">Enter the exact name of the person to call.</p>
          <input type="text" id="dialInput" placeholder="Contact name" class="input sheet-input" maxlength="20" />
          <button id="dialBtn" class="btn-primary sheet-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.45 2 2 0 0 1 3.59 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.96a16 16 0 0 0 6 6l.92-.92a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16.92z"/>
            </svg>
            Call
          </button>
        </div>
      </div>
    </div>

    <!-- ═══ CALL SCREEN ═══ -->
    <div id="callScreen" class="screen call-screen">
      <video id="remoteVideo" autoplay playsinline class="video-full"></video>
      <div class="video-placeholder" id="remotePlaceholder">
        <div class="spinner"></div>
      </div>

      <div class="pip" id="pipContainer">
        <video id="webcamVideo" autoplay playsinline muted class="pip-video"></video>
        <div class="pip-off" id="localPlaceholder">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        </div>
      </div>

      <div class="call-overlay-info">
        <h2 id="callPeerName">Unknown</h2>
        <span class="call-timer" id="callTimer">Calling...</span>
      </div>

      <div class="call-bottom">
        <div class="call-controls">
          <button id="muteBtn" class="ctrl-btn" title="Mute">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            <span class="ctrl-label">Mute</span>
          </button>
          <button id="videoToggleBtn" class="ctrl-btn" title="Video">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            <span class="ctrl-label">Video</span>
          </button>
          <button id="hangupBtn" class="ctrl-btn end-call-btn" title="End Call">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-4.69-5.88 19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 3.59 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.96a16 16 0 0 0 6 6l.92-.92a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16.92z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- ═══ INCOMING CALL ═══ -->
    <div id="incomingOverlay" class="incoming-overlay hidden">
      <div class="incoming-sheet">
        <div class="inc-avatar" id="incAvatar">?</div>
        <h3 id="incomingCallerName">Someone</h3>
        <p>Incoming video call</p>
        <div class="inc-actions">
          <button id="declineBtn" class="inc-btn inc-decline">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 3.59 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.96"/></svg>
          </button>
          <button id="acceptBtn" class="inc-btn inc-accept">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.45 2 2 0 0 1 3.59 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.96a16 16 0 0 0 6 6l.92-.92a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16.92z"/></svg>
          </button>
        </div>
      </div>
    </div>

  </body>
</html>
